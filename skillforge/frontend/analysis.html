<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gap Analysis — SkillForge</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <div id="sidebar-mount" data-active="analysis"></div>

      <main>
        <p class="eyebrow">Diagnose</p>
        <h1 class="page-title">Skill Gap Analysis</h1>
        <p class="page-sub">
          Paste your resume and a target job description. SkillForge finds what
          matches, what's missing, and gives you a readiness score.
        </p>

        <div class="grid-2 section-gap">
          <div class="card">
            <div class="field">
              <label for="resume">Resume text (min. 50 characters)</label>
              <textarea
                id="resume"
                rows="9"
                placeholder="Paste your resume content here…"
              ></textarea>
            </div>
            <div class="field">
              <label for="jd">Job description (min. 50 characters)</label>
              <textarea
                id="jd"
                rows="9"
                placeholder="Paste the target job description here…"
              ></textarea>
            </div>
            <button
              class="btn"
              id="run-btn"
              style="width: 100%; justify-content: center"
            >
              Run analysis
            </button>
          </div>

          <div class="card" id="result-card">
            <p class="empty" id="result-placeholder">
              Your analysis will appear here once you run it.<br />This calls
              your AI provider, so it may take a few seconds.
            </p>
            <div id="result-content" style="display: none"></div>
          </div>
        </div>

        <div class="card" id="history-card" style="padding: 0">
          <div style="padding: 22px 22px 0 22px">
            <h3 style="margin: 0; font-size: 15px">Past analyses</h3>
          </div>
          <div id="history-list" style="padding: 22px">
            <p class="empty">Loading…</p>
          </div>
        </div>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
      let lastAnalysisId = null;

      function renderResult(a) {
        lastAnalysisId = a.id;
        const gap = a.gap_analysis || {};
        const extracted = a.extracted_skills || {};
        const matching = extracted.matching_skills || [];
        const missing = extracted.missing_skills || [];
        const priorities = gap.priority_skills_to_learn || [];

        document.getElementById("result-placeholder").style.display = "none";
        const content = document.getElementById("result-content");
        content.style.display = "block";
        content.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <p class="stat-label">Readiness score</p>
          <p class="stat-value">${a.readiness_score}<span style="font-size:16px; color:var(--muted);">/100</span></p>
        </div>
        <a class="btn secondary" href="plan.html?analysis_id=${a.id}">Generate weekly plan →</a>
      </div>
      ${gap.summary ? `<p style="font-size:13.5px; color:var(--muted); margin-bottom:18px;">${escapeHtml(gap.summary)}</p>` : ""}
      <div style="margin-bottom:16px;">
        <p class="stat-label" style="margin-bottom:8px;">Matching skills</p>
        <div>${matching.map((s) => `<span class="badge" style="margin:0 6px 6px 0; display:inline-block;">${escapeHtml(s)}</span>`).join("") || '<span style="color:var(--muted); font-size:13px;">None found</span>'}</div>
      </div>
      <div>
        <p class="stat-label" style="margin-bottom:8px;">Missing skills</p>
        <div>${missing.map((s) => `<span class="badge warn" style="margin:0 6px 6px 0; display:inline-block;">${escapeHtml(s)}</span>`).join("") || '<span style="color:var(--muted); font-size:13px;">None — great coverage</span>'}</div>
      </div>
      ${
        priorities.length
          ? `
      <div style="margin-top:18px;">
        <p class="stat-label" style="margin-bottom:8px;">Priority to learn first</p>
        <table>
          <thead><tr><th>Skill</th><th>Why</th><th>Est. weeks</th></tr></thead>
          <tbody>
            ${priorities.map((p) => `<tr><td><strong>${escapeHtml(p.skill)}</strong></td><td style="color:var(--muted); font-size:12.5px;">${escapeHtml(p.reason || "")}</td><td>${p.estimated_weeks ?? "—"}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>`
          : ""
      }
    `;
      }

      document.getElementById("run-btn").addEventListener("click", async () => {
        const resume_text = document.getElementById("resume").value.trim();
        const job_description = document.getElementById("jd").value.trim();
        if (resume_text.length < 50 || job_description.length < 50) {
          showToast(
            "Resume and job description must each be at least 50 characters",
            true,
          );
          return;
        }
        const btn = document.getElementById("run-btn");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Analyzing…`;
        try {
          const result = await apiRequest("/analyze/", {
            method: "POST",
            body: JSON.stringify({ resume_text, job_description }),
          });
          renderResult(result);
          showToast("Analysis complete");
          loadHistory();
        } catch (e) {
          showToast(e.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = "Run analysis";
        }
      });

      async function loadHistory() {
        const list = document.getElementById("history-list");
        try {
          const items = await apiRequest("/analyze/?limit=10");
          if (!items.length) {
            list.innerHTML = `<p class="empty">No analyses yet — run your first one above.</p>`;
            return;
          }
          list.innerHTML = `
        <table>
          <thead><tr><th>Date</th><th>Score</th><th>Missing skills</th><th></th></tr></thead>
          <tbody>
            ${items
              .map(
                (a) => `
              <tr>
                <td>${fmtDate(a.created_at)}</td>
                <td><span class="badge">${a.readiness_score}/100</span></td>
                <td style="color:var(--muted); font-size:12.5px;">${(a.extracted_skills.missing_skills || []).slice(0, 4).join(", ") || "—"}</td>
                <td style="text-align:right;"><a class="btn outline" style="padding:6px 12px; font-size:12.5px;" href="plan.html?analysis_id=${a.id}">Make plan</a></td>
              </tr>`,
              )
              .join("")}
          </tbody>
        </table>`;
        } catch (e) {
          list.innerHTML = `<p class="empty">Couldn't reach the backend. Is it running at http://127.0.0.1:8000?</p>`;
        }
      }

      loadHistory();
    </script>
  </body>
</html>
